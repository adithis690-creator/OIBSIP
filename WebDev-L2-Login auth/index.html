<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Gate System - Level 2 Task 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-box" id="auth-box">
        <h2 id="form-title">Login Dashboard</h2>
        <form id="auth-form" onsubmit="handleAuth(event)">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submit-btn">Sign In</button>
        </form>
        <p id="toggle-msg">New User? <span onclick="toggleMode()">Create account</span></p>
        <p id="error-feedback" class="error"></p>
    </div>

    <div class="secured-page hidden" id="secured-page">
        <h2>Welcome to the Enterprise Core Terminal!</h2>
        <p>Authentication validation passed successfully via storage tokens.</p>
        <button onclick="logout()">Secure Exit</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
